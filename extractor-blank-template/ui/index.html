<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add to Archive</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="brand">
      <img src="icon.png" alt="" class="brand-icon">
      <div>
        <h1 id="title">Add to Archive</h1>
        <p class="subtitle">A Elite Estrangeira</p>
      </div>
    </header>
    <section class="card" id="add-card">
      <label>Archive name</label>
      <input id="archive-name" type="text">
      <label>Archive format</label>
      <select id="format">
        <option value="elite" selected>ELITE (.elite) - A Elite Estrangeira</option>
        <option value="zip">ZIP (.zip)</option>
      </select>
      <label>Compression level</label>
      <select id="level">
        <option value="1">1 - Fast</option>
        <option value="3" selected>3 - Normal</option>
        <option value="9">9 - Maximum</option>
        <option value="19">19 - Ultra (ELITE)</option>
      </select>
      <label>Password (optional, ELITE only)</label>
      <input id="password" type="password">
      <label>Reenter password</label>
      <input id="password2" type="password">
      <p class="hint">ELITE uses Zstandard compression, SHA-256 integrity and AES-256-GCM encryption with Argon2id when a password is set.</p>
      <div class="actions">
        <button id="btn-create">Create archive</button>
      </div>
      <pre id="status" class="log"></pre>
    </section>
    <section class="card hidden" id="password-card">
      <label>Archive password</label>
      <input id="extract-password" type="password">
      <div class="actions">
        <button id="btn-extract">Extract</button>
      </div>
      <pre id="password-status" class="log"></pre>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
