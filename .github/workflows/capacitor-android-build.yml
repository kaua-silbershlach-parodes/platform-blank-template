name: Capacitor Android build (APK)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'capacitor-blank-template/android/**'
      - 'capacitor-blank-template/www/**'
      - 'capacitor-blank-template/capacitor.config.ts'
      - 'capacitor-blank-template/package.json'
      - 'capacitor-blank-template/package-lock.json'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: capacitor-blank-template/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        working-directory: capacitor-blank-template
      - run: npx cap sync android
        working-directory: capacitor-blank-template
      - name: Build debug APK
        working-directory: capacitor-blank-template/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: capacitor-blank-template/android/app/build/outputs/apk/debug/app-debug.apk
